<!DOCTYPE html>
<!-- The banner: a monitor with the launcher's windows above the fire of Diablo II's
     title, beside the wordmark. docs/banner.sh fills it in. -->
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1280px; height:640px; overflow:hidden; }
  body { position:relative; }
  /* Antique gold, the night and Diablo II's parchment. */
  :root {
    --night:#0b0807; --gold-light:#d9c08a; --gold:#b8935a; --parchment:#eadfc4;
    --scale:calc({{SCALE}});
  }

  /* The stand, the monitor and its glass, measured as in the banners of Arch OS. */
  .floor {
    position:absolute; left:463px; top:594px; width:354px; height:20px;
    background:radial-gradient(closest-side, rgba(0,0,0,.22), transparent);
  }
  .neck {
    position:absolute; left:565px; top:534px; width:150px; height:60px;
    clip-path:polygon(7% 0, 93% 0, 100% 100%, 0 100%);
    background:
      linear-gradient(90deg, rgba(0,0,0,.16), transparent 14% 86%, rgba(0,0,0,.16)),
      linear-gradient(180deg, #4a4e55 0%, #8e939a 34%, #c4c8cd 100%);
  }
  .foot {
    position:absolute; left:522px; top:592px; width:236px; height:10px; border-radius:3px;
    background:linear-gradient(180deg, #f2f3f5 0 1px, #c9cdd2 1px 40%, #8a8f96 100%);
    box-shadow:0 0 0 1px rgba(0,0,0,.06), 0 4px 8px -4px rgba(0,0,0,.3);
  }
  .monitor {
    position:absolute; left:195px; top:30px; width:890px; height:512px;
    padding:2px; border-radius:16px;
    background:linear-gradient(180deg, #e6e8eb, #9fa4ab);
    box-shadow:0 0 0 1px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.06), 0 30px 60px -28px rgba(0,0,0,.34);
  }
  .glass {
    position:relative; width:100%; height:100%; padding:11px;
    border-radius:14px; background:#0a0b0d;
  }
  .camera {
    position:absolute; left:50%; top:3.5px; width:4px; height:4px; margin-left:-2px;
    border-radius:50%; background:#1b1e24; box-shadow:inset 0 0 0 1px #2b3038;
  }
  /* The picture at the screen's own size, so every edge lands on a pixel. */
  .screen {
    position:relative; width:864px; height:486px; overflow:hidden; border-radius:3px;
    background:var(--night); isolation:isolate;
  }
  .scene { position:absolute; inset:0; }

  /* The launcher's windows at the scale docs/banner.sh gives them, one image pixel
     to one screen pixel, with libadwaita's corners and the hairline of gold the
     game frames wear. */
  .window { position:absolute; overflow:hidden; }
  .window img { display:block; }
  .window::after {
    content:""; position:absolute; inset:0; border-radius:inherit;
    box-shadow:inset 0 0 0 .5px rgba(217,192,138,.5);
    background:linear-gradient(0deg, rgba(255,128,48,.09), transparent 40%);
  }
  .menu {
    left:518px; top:52px; border-radius:calc(15px * var(--scale));
    box-shadow:0 32px 64px -16px rgba(0,0,0,.85), 0 8px 24px rgba(0,0,0,.5);
  }
  .update {
    left:446px; top:316px; border-radius:calc(18px * var(--scale));
    box-shadow:0 32px 64px -16px rgba(0,0,0,.9), 0 8px 24px rgba(0,0,0,.55), 0 -12px 40px rgba(0,0,0,.35);
  }

  /* The name, centered in the dark beside the windows. */
  .said {
    position:absolute; left:23px; width:400px; top:0; bottom:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  }
  .mark {
    display:block; width:64px; height:64px;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,.7)) drop-shadow(0 0 24px rgba(255,122,38,.25));
  }
  .eyebrow {
    margin-top:24px; font:600 12px/16px "Cormorant Garamond"; letter-spacing:.36em; margin-right:-.36em;
    text-transform:uppercase; color:var(--gold); opacity:.9;
  }
  .wordmark {
    margin-top:8px; white-space:nowrap;
    font:400 44px/56px "Metamorphous"; letter-spacing:.06em; margin-right:-.06em; text-transform:uppercase;
    background:linear-gradient(180deg, #f3e7c9 10%, #d9c08a 38%, #a9854c 60%, #765628 80%, #b39060 95%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 0 rgba(20,10,4,.9)) drop-shadow(0 0 24px rgba(255,120,40,.22));
  }
  /* Hairlines of one screen pixel each, so they sit on a whole one. */
  .rule { display:flex; gap:12px; width:176px; height:8px; margin-top:16px; }
  .rule i { flex:1; height:.5px; margin-top:3.5px; background:linear-gradient(90deg, rgba(217,192,138,0), var(--gold-light)); }
  .rule i:last-child { transform:scaleX(-1); }
  .rule b {
    align-self:center; width:6px; height:6px; transform:rotate(45deg); background:var(--gold-light);
    box-shadow:0 0 8px rgba(255,138,46,.7);
  }
  .tag {
    margin-top:16px; font:500 20px/28px "Cormorant Garamond"; color:var(--parchment);
    text-shadow:0 1px 0 rgba(0,0,0,.6);
  }
</style></head><body>
  <div class="floor"></div>
  <div class="neck"></div>
  <div class="foot"></div>
  <div class="monitor"><div class="glass">
    <span class="camera"></span>
    <div class="screen">
      <svg class="scene" width="864" height="486" viewBox="0 0 864 486">
        <defs>
          <!-- Rough stone, lit from the fire below and dark away from it. -->
          <filter id="stone" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency=".012 .018" numOctaves="5" seed="11"/>
            <feDiffuseLighting surfaceScale="3" diffuseConstant="1" lighting-color="#e9935e">
              <fePointLight x="640" y="520" z="150"/>
            </feDiffuseLighting>
            <feComponentTransfer>
              <feFuncR type="gamma" exponent="2.2"/>
              <feFuncG type="gamma" exponent="2.5"/>
              <feFuncB type="gamma" exponent="2.8"/>
            </feComponentTransfer>
          </filter>
          <filter id="smoke" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency=".004 .009" numOctaves="4" seed="3"/>
            <feColorMatrix values="0 0 0 0 .55  0 0 0 0 .42  0 0 0 0 .36  0 0 0 1.6 -.75"/>
          </filter>
          <!-- Flames that lick, and their bloom. -->
          <filter id="lick" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="turbulence" baseFrequency=".018 .05" numOctaves="3" seed="5"/>
            <feDisplacementMap in="SourceGraphic" scale="10" xChannelSelector="R" yChannelSelector="G"/>
            <feGaussianBlur stdDeviation=".6"/>
          </filter>
          <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
          <linearGradient id="flame-outer" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#ff6a1a" stop-opacity=".95"/>
            <stop offset=".4" stop-color="#c8301a" stop-opacity=".7"/>
            <stop offset=".8" stop-color="#6e0e0c" stop-opacity=".3"/>
            <stop offset="1" stop-color="#3a0606" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="flame-middle" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#ffb03a"/>
            <stop offset=".45" stop-color="#ff641a" stop-opacity=".85"/>
            <stop offset=".85" stop-color="#b8240f" stop-opacity=".25"/>
            <stop offset="1" stop-color="#b8240f" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="flame-core" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#fff6d6"/>
            <stop offset=".35" stop-color="#ffd56a" stop-opacity=".95"/>
            <stop offset=".75" stop-color="#ff8a24" stop-opacity=".4"/>
            <stop offset="1" stop-color="#ff8a24" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="glow" cx="640" cy="530" r="440" gradientUnits="userSpaceOnUse"
              gradientTransform="translate(640 530) scale(1 .64) translate(-640 -530)">
            <stop offset="0" stop-color="#ff7a26" stop-opacity=".6"/>
            <stop offset=".45" stop-color="#c2361a" stop-opacity=".24"/>
            <stop offset="1" stop-color="#5a0e08" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="backlight" cx="640" cy="250" r="300" gradientUnits="userSpaceOnUse"
              gradientTransform="translate(640 250) scale(1 .8) translate(-640 -250)">
            <stop offset="0" stop-color="#ff7a30" stop-opacity=".16"/>
            <stop offset="1" stop-color="#ff7a30" stop-opacity="0"/>
          </radialGradient>
          <!-- The name's side stays dark, the edges sink. -->
          <linearGradient id="calm" x1="0" y1="0" x2="1" y2="0">
            <stop offset=".28" stop-color="#0b0807"/>
            <stop offset=".56" stop-color="#0b0807" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="vignette" cx=".5" cy=".42" r=".78">
            <stop offset=".5" stop-color="#000" stop-opacity="0"/>
            <stop offset="1" stop-color="#000" stop-opacity=".7"/>
          </radialGradient>
        </defs>
        <rect width="864" height="486" filter="url(#stone)"/>
        <rect width="864" height="486" filter="url(#smoke)" opacity=".22"/>
        <rect width="864" height="486" fill="url(#calm)" opacity=".85"/>
        <rect width="864" height="486" fill="url(#glow)"/>
        <rect width="864" height="486" fill="url(#backlight)"/>
        <g id="fire"></g>
        <g id="embers"></g>
        <rect width="864" height="486" fill="url(#vignette)"/>
      </svg>
      <div class="window menu"><img src="menu.png" srcset="menu.png 2x" alt=""></div>
      <div class="window update"><img src="update.png" srcset="update.png 2x" alt=""></div>
      <div class="said">
        <img class="mark" src="d2launcher.svg" alt="">
        <div class="eyebrow">Diablo II · Median XL</div>
        <div class="wordmark">D2Launcher</div>
        <div class="rule"><i></i><b></b><i></i></div>
        <div class="tag">{{TAGLINE}}</div>
      </div>
    </div>
  </div></div>
  <script>
    // Flame tongues and embers out of a seeded generator, so every render draws the same fire.
    let seed = 20;
    const rand = () => (seed = seed * 16807 % 2147483647) / 2147483647;
    const between = (a, b) => a + rand() * (b - a);
    const add = (parent, name, attrs) => {
      const el = parent.appendChild(document.createElementNS('http://www.w3.org/2000/svg', name));
      for (const key in attrs) el.setAttribute(key, attrs[key]);
      return el;
    };
    const center = 680, span = 250, base = 492;

    const fire = document.getElementById('fire');
    const bloom = add(fire, 'g', { filter: 'url(#bloom)', opacity: .9, style: 'mix-blend-mode:screen' });
    const flames = add(fire, 'g', { filter: 'url(#lick)', style: 'mix-blend-mode:screen' });
    for (const [count, height, width, fill] of [
      [30, [44, 116], [16, 42], 'flame-outer'],
      [34, [26, 72], [12, 30], 'flame-middle'],
      [24, [12, 38], [10, 24], 'flame-core'],
    ]) {
      for (let i = 0; i < count; i++) {
        const x = center + (rand() + rand() + rand() - 1.5) * span * 1.4;
        const reach = Math.max(0, 1 - Math.abs(x - center) / (span * 1.6));
        const h = between(...height) * (.25 + .75 * reach) * (x > 760 ? 1.35 : 1), w = between(...width);
        const tipX = x + between(-.35, .1) * h, tipY = base - h, l = x - w / 2, r = x + w / 2;
        const d = `M${l} ${base}C${l} ${base - h * .5} ${tipX - w * .1} ${base - h * .78} ${tipX} ${tipY}` +
                  `C${tipX + w * .1} ${base - h * .78} ${r} ${base - h * .5} ${r} ${base}Z`;
        add(flames, 'path', { fill: `url(#${fill})`, d });
        add(bloom, 'path', { fill: `url(#${fill})`, d });
      }
    }

    const embers = document.getElementById('embers');
    for (let i = 0; i < 110; i++) {
      const x = center + (rand() + rand() - 1) * 440 - rand() * 120;
      const y = base - 20 - Math.pow(rand(), 1.4) * 450;
      const heat = 1 - (base - y) / 480, clear = Math.min(1, (x - 420) / 120);
      if (clear <= 0) continue;
      const color = ['#ffe2a0', '#ffc061', '#ff9a3c', '#ff7a2a'][Math.floor(rand() * 4)];
      if (rand() < .12) {
        add(embers, 'circle', { cx: x, cy: y, r: between(3, 7), fill: color,
          opacity: between(.08, .22) * (.4 + heat) * clear, style: `filter:blur(${between(2, 4)}px)` });
        continue;
      }
      const r = between(.6, 1.9) * (.55 + .45 * heat), o = between(.4, 1) * (.3 + .7 * heat) * clear;
      if (rand() < .35) {
        add(embers, 'ellipse', { cx: x, cy: y, rx: r * .75, ry: r * between(2.5, 5), fill: color, opacity: o,
          transform: `rotate(${between(-30, 0)} ${x} ${y})`, style: 'filter:blur(.4px)' });
      } else {
        add(embers, 'circle', { cx: x, cy: y, r, fill: color, opacity: o, style: `filter:blur(${between(.15, .6)}px)` });
      }
      if (r > 1.1) add(embers, 'circle', { cx: x, cy: y, r: r * 4, fill: color, opacity: o * .18, style: 'filter:blur(3px)' });
    }
  </script>
</body></html>
