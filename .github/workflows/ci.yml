# Pull requests are checked, and main monthly against the newest distributions
# too.

name: CI

on:
  pull_request:
  schedule:
    - cron: '0 6 1 * *'

permissions: {}

# Every step in bash with pipefail, as the Makefile runs its recipes.
defaults:
  run:
    shell: bash

# A new push replaces a pull request's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # make check on Arch, as the machines it runs on.
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The date names the base, the digest pins it. Publish and the Makefile use the same.
    container: archlinux:base-devel-20261011.0.609700@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
    permissions:
      contents: read
    steps:
      - run: pacman -Syu --noconfirm --needed make git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - run: |
          read -ra packages < <(make -s packages)
          pacman -S --noconfirm --needed "${packages[@]}"

      - run: make check

  # D2Launcher's Wine on Arch, Debian, Ubuntu, Fedora and openSUSE with what the
  # project names for each, monthly, as they move under it.
  distros:
    name: Distros
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - run: make distro-check
